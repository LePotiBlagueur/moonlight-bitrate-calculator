[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonlight-bitrate-calculator"
version = "2.1.0"
description = "Mesure UDP du lien Sunshine → Moonlight et calcul du débit optimal par résolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["paramiko>=3.0"]

[project.scripts]
moonlight-bitrate = "moonlight_bitrate.cli:main"
moonlight-recap = "moonlight_bitrate.recap_cli:main"

[tool.setuptools]
packages = ["moonlight_bitrate"]
