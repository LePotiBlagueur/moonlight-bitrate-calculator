name: Exécutables Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s . -p 'test_*.py' -v

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e . pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm packaging/moonlight.spec

      - name: Vérification des exécutables
        run: |
          dist\moonlight-bitrate.exe --version
          dist\moonlight-recap.exe --version
          dist\moonlight-recap.exe -b 450 --sections best --no-color

      - name: Préparation de l'archive
        run: |
          Copy-Item config.example.toml dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath moonlight-bitrate-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-bitrate-windows
          path: moonlight-bitrate-windows.zip
          retention-days: 90

      - name: Publication sur la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moonlight-bitrate-windows.zip
            dist/moonlight-bitrate.exe
            dist/moonlight-recap.exe
